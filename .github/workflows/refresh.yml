name: Refresh from Asana

# Pulls the Asana export and rebuilds the dashboard four times a day.
#
# Previous version fired four crons and used a gate step that only allowed the
# run to proceed when the US Central hour was exactly 00 or 12, so the schedule
# would land on midnight and noon Central through daylight saving changes.
#
# That gate is removed. GitHub delays scheduled runs under load, and a delay of
# more than a few minutes past the top of the hour pushed every run outside its
# window and skipped it. Between 2026-08-26 and 2026-08-28 four consecutive runs
# were skipped that way and the dashboard sat two days stale while every run
# still reported success, which is the worst kind of failure: silent.
#
# Now every cron simply runs. Four refreshes a day instead of two, no timezone
# logic, and no way for a delay to skip a day. Times drift by an hour between
# CDT and CST, which does not matter for a data refresh.
#   05:00 / 17:00 UTC = 12 AM / 12 PM CDT   (11 PM / 11 AM CST)
#   06:00 / 18:00 UTC =  1 AM /  1 PM CDT   (12 AM / 12 PM CST)
#
# Use Run workflow to refresh on demand.

on:
  schedule:
    - cron: '0 5,6,17,18 * * *'
  workflow_dispatch: {}

# A refresh commits data.xlsx and index.html. Two overlapping runs would race on
# the push, so let one finish before the next starts.
concurrency:
  group: refresh-from-asana
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Export from Asana
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
        run: python fetch_asana.py

      # A silent no-op is what let the stale data go unnoticed, so fail loudly if
      # the export produced nothing usable rather than rebuilding on an empty file.
      - name: Check the export actually returned data
        run: |
          python - <<'PY'
          import sys, openpyxl
          wb = openpyxl.load_workbook('data.xlsx')
          rows = wb['Raw Data'].max_row - 1
          print(f"data.xlsx contains {rows} records")
          if rows < 1:
              sys.exit("Asana export returned no records. Refusing to rebuild the dashboard.")
          PY

      - name: Build dashboard
        run: python build.py data.xlsx

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.xlsx index.html
          git diff --staged --quiet || git commit -m "Refresh Asana data [skip ci]"
          git push
